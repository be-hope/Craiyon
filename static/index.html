<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>craiyon_aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17181b;
    --paper: #1f2124;
    --paper-raised: #26292e;
    --line: #34373d;
    --aura-green: #3ecf5e;
    --aura-green-dim: #2a9a45;
    --coral: #ff6b4a;
    --gold: #ffc857;
    --chalk: #f2f0ea;
    --smoke: #93959e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--chalk);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 20px 16px 90px; }

  /* ---------- Header / wordmark ---------- */
  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .mark { width: 30px; height: 30px; flex-shrink: 0; }
  .wordmark {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--chalk);
  }
  .wordmark span { color: var(--aura-green); }
  .tagline {
    color: var(--smoke);
    font-size: 14px;
    margin: 6px 0 22px;
  }

  /* signature scribble underline */
  .scribble {
    display: block;
    width: 74px;
    height: 10px;
    margin-top: 4px;
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h2 {
    font-family: 'Unbounded', sans-serif;
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 14px;
    color: var(--chalk);
  }
  label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--smoke);
    margin-bottom: 6px;
    font-weight: 600;
  }
  input, textarea {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 12px 13px;
    color: var(--chalk);
    font-size: 15px;
    font-family: 'Work Sans', sans-serif;
    margin-bottom: 16px;
  }
  input::placeholder, textarea::placeholder { color: #55585f; }
  input:focus, textarea:focus {
    outline: 2px solid var(--aura-green);
    outline-offset: -1px;
    border-color: var(--aura-green);
  }
  textarea { resize: vertical; min-height: 76px; }

  button {
    background: var(--aura-green);
    color: #0d1a10;
    border: none;
    border-radius: 9px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Work Sans', sans-serif;
    cursor: pointer;
    width: 100%;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:hover:not(:disabled) { background: #4ee06c; }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .error {
    background: rgba(255,107,74,0.1);
    border: 1px solid rgba(255,107,74,0.35);
    color: var(--coral);
    font-size: 13.5px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  /* ---------- Top bar (in-game) ---------- */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; font-size: 13px; color: var(--smoke);
  }
  .seat-chip {
    font-family: 'Space Mono', monospace;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 999px;
    color: var(--chalk);
  }
  .link-btn { color: var(--aura-green); font-size: 13px; cursor: pointer; font-weight: 600; }

  /* ---------- Target picker ---------- */
  .target-list { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 18px; padding-bottom: 2px; }
  .target-pill {
    flex-shrink: 0; padding: 9px 15px; border-radius: 999px;
    border: 1px solid var(--line); cursor: pointer; font-size: 13px;
    background: var(--paper); color: var(--smoke); font-weight: 600;
    font-family: 'Space Mono', monospace;
    transition: all 0.15s ease;
  }
  .target-pill.active {
    background: var(--aura-green); color: #0d1a10; border-color: var(--aura-green);
  }

  .target-thumb {
    width: 100%; border-radius: 10px; margin-bottom: 4px;
    border: 1px solid var(--line); display: block;
  }
  .thumb-caption { font-size: 12px; color: var(--smoke); margin-bottom: 16px; }

  /* ---------- Result comparison ---------- */
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .result-grid img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .result-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--smoke); margin-bottom: 6px; font-weight: 600;
  }

  .score-panel {
    margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  .score-number {
    font-family: 'Space Mono', monospace;
    font-size: 42px; font-weight: 700; line-height: 1;
  }
  .score-number.high { color: var(--aura-green); }
  .score-number.mid { color: var(--gold); }
  .score-number.low { color: var(--coral); }
  .score-unit { font-family: 'Space Mono', monospace; font-size: 16px; color: var(--smoke); }
  .score-tier { font-family: 'Unbounded', sans-serif; font-size: 14px; margin-top: 2px; }
  .attempts-left {
    font-size: 12.5px; color: var(--smoke); margin-top: 8px; width: 100%;
    font-family: 'Space Mono', monospace;
  }

  /* ---------- Leaderboard ---------- */
  .leaderboard-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .leaderboard-row:last-child { border-bottom: none; }
  .rank {
    font-family: 'Space Mono', monospace; color: var(--smoke); width: 30px; display: inline-block; font-size: 13px;
  }
  .leaderboard-row.first .rank { color: var(--gold); font-weight: 700; }
  .leaderboard-row .seat-name { font-family: 'Space Mono', monospace; }
  .leaderboard-row .pts { font-family: 'Space Mono', monospace; font-weight: 700; }

  .empty-state {
    text-align: center; color: var(--smoke); padding: 26px 10px; font-size: 14px;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const API_BASE = "";

const AURA_MARK_SVG = `
<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M50 14 L82 62 L64 62 L50 40 L36 62 L18 62 Z" stroke="#f2f0ea" stroke-width="6" stroke-linejoin="round" fill="none"/>
  <rect x="34" y="66" width="32" height="9" rx="1.5" fill="#3ecf5e" transform="skewX(-18)"/>
</svg>`;

const SCRIBBLE_SVG = `
<svg class="scribble" viewBox="0 0 74 10" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M2 7 C 14 2, 20 9, 30 5 S 48 1, 58 6 S 68 8, 72 4" stroke="#3ecf5e" stroke-width="3" stroke-linecap="round"/>
</svg>`;

let state = {
  seat_id: localStorage.getItem("seat_id") || null,
  room_id: localStorage.getItem("room_id") || null,
  targets: [],
  activeTargetId: null,
  loading: false,
  error: null,
  lastResult: null,
  leaderboard: [],
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

async function api(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || "Something went wrong");
  return data;
}

async function login(username, password) {
  setState({ loading: true, error: null });
  try {
    const result = await api("/login", {
      method: "POST",
      body: JSON.stringify({ username, password }),
    });
    localStorage.setItem("seat_id", result.seat_id);
    localStorage.setItem("room_id", result.room_id);
    setState({ seat_id: result.seat_id, room_id: result.room_id, loading: false });
    await loadTargets();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

function logout() {
  localStorage.clear();
  state = { ...state, seat_id: null, room_id: null, targets: [], lastResult: null };
  render();
}

async function loadTargets() {
  setState({ loading: true });
  try {
    const targets = await api("/targets");
    setState({
      targets,
      activeTargetId: targets.length ? targets[0].id : null,
      loading: false,
    });
    if (targets.length) loadLeaderboard();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function loadLeaderboard() {
  try {
    const board = await api(`/leaderboard/${state.room_id}`);
    setState({ leaderboard: board });
  } catch (e) { /* non-fatal */ }
}

async function generate(prompt) {
  if (!prompt.trim()) return;
  setState({ loading: true, error: null });
  try {
    const result = await api("/generate", {
      method: "POST",
      body: JSON.stringify({
        seat_id: state.seat_id,
        room_id: state.room_id,
        target_id: state.activeTargetId,
        prompt,
      }),
    });
    setState({ loading: false, lastResult: result });
    loadLeaderboard();
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

function scoreTier(score) {
  if (score >= 80) return { label: "Nailed it", cls: "high" };
  if (score >= 55) return { label: "So close", cls: "mid" };
  if (score >= 30) return { label: "Getting there", cls: "mid" };
  return { label: "Way off — try again", cls: "low" };
}

function renderLogin() {
  return `
    <div class="brand-row">
      <div class="mark">${AURA_MARK_SVG}</div>
      <div class="wordmark">craiyon<span>_aura</span></div>
    </div>
    <div class="tagline">Redraw it. Match it. Beat the room.</div>
    ${SCRIBBLE_SVG}
    <div class="card" style="margin-top:18px;">
      <h2>Seat login</h2>
      ${state.error ? `<div class="error">${state.error}</div>` : ""}
      <label>Username</label>
      <input id="username" placeholder="SEAT001_1" autocapitalize="characters" autocomplete="off" />
      <label>Password</label>
      <input id="password" type="password" placeholder="S001_1" autocomplete="off" />
      <button id="loginBtn" ${state.loading ? "disabled" : ""}>
        ${state.loading ? "Checking..." : "Enter the room"}
      </button>
    </div>
  `;
}

function renderWorkshop() {
  const target = state.targets.find(t => t.id === state.activeTargetId);
  const tier = state.lastResult ? scoreTier(state.lastResult.score) : null;

  return `
    <div class="top-bar">
      <span class="seat-chip">${state.seat_id} · Room ${state.room_id}</span>
      <span class="link-btn" id="logoutBtn">Log out</span>
    </div>
    <div class="brand-row">
      <div class="mark">${AURA_MARK_SVG}</div>
      <div class="wordmark">craiyon<span>_aura</span></div>
    </div>
    <div class="tagline">Pick an image, write a prompt, see how close you get.</div>

    ${state.targets.length ? `
      <div class="target-list">
        ${state.targets.map(t => `
          <div class="target-pill ${t.id === state.activeTargetId ? "active" : ""}" data-target="${t.id}">
            ${t.label}
          </div>
        `).join("")}
      </div>

      <div class="card">
        <h2>Target image</h2>
        <img class="target-thumb" src="${target.image_url}" alt="${target.label}" />
        <div class="thumb-caption">Describe this as precisely as you can — colors, composition, style, all count.</div>

        ${state.error ? `<div class="error">${state.error}</div>` : ""}

        <label>Your prompt</label>
        <textarea id="promptInput" placeholder="Describe exactly what you see..."></textarea>
        <button id="generateBtn" ${state.loading ? "disabled" : ""}>
          ${state.loading ? "Generating..." : "Generate & score"}
        </button>

        ${state.lastResult ? `
          <div class="result-grid">
            <div>
              <div class="result-label">Target</div>
              <img src="${target.image_url}" />
            </div>
            <div>
              <div class="result-label">Your result</div>
              <img src="${state.lastResult.image_url}" />
            </div>
          </div>
          <div class="score-panel">
            <div>
              <span class="score-number ${tier.cls}">${state.lastResult.score}</span><span class="score-unit"> /100</span>
              <div class="score-tier">${tier.label}</div>
            </div>
            <div class="attempts-left">${state.lastResult.attempts_left} attempt(s) left on this image</div>
          </div>
        ` : ""}
      </div>
    ` : `<div class="card"><div class="empty-state">No images loaded yet — ask your room's host to load today's set.</div></div>`}

    <div class="card">
      <div class="top-bar" style="margin-bottom:8px;">
        <h2 style="margin:0;">Room ${state.room_id} — live scores</h2>
        <span class="link-btn" id="refreshBoard">Refresh</span>
      </div>
      ${state.leaderboard.length ? state.leaderboard.map((row, i) => `
        <div class="leaderboard-row ${i === 0 ? "first" : ""}">
          <span><span class="rank">#${i + 1}</span><span class="seat-name">${row.seat_id}</span></span>
          <span class="pts">${row.total_score}</span>
        </div>
      `).join("") : `<div class="empty-state">No scores yet — be the first to generate.</div>`}
    </div>
  `;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = state.seat_id ? renderWorkshop() : renderLogin();

  if (!state.seat_id) {
    document.getElementById("loginBtn").onclick = () => {
      login(document.getElementById("username").value, document.getElementById("password").value);
    };
  } else {
    document.getElementById("logoutBtn").onclick = logout;
    const refreshBtn = document.getElementById("refreshBoard");
    if (refreshBtn) refreshBtn.onclick = loadLeaderboard;
    document.querySelectorAll(".target-pill").forEach(el => {
      el.onclick = () => setState({ activeTargetId: parseInt(el.dataset.target), lastResult: null, error: null });
    });
    const genBtn = document.getElementById("generateBtn");
    if (genBtn) genBtn.onclick = () => generate(document.getElementById("promptInput").value);
  }
}

render();
if (state.seat_id) loadTargets();
</script>
</body>
</html>
